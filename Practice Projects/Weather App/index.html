<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="images/search.png"></button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="images/rainy-day.png" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="" class="humidity-icon">
                <div class="humidity">
                    <!-- <h2 class="humidity">50%</h2>
                    <p>Humidity</p> -->
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png" alt="" class="wind-icon">
                <div class="wind">
                    <h2 class="wind">22 km/h</h2>
                    <p>Wind Speed</p>
                </div>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>

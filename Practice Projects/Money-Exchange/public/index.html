<!DOCTYPE html>
<html lang="en">
<!-- ===================== HEAD ===================== -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="icon" type="image/png" href="img/exchange.png" />


    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- ===================== CARD CONTAINER ===================== -->
    <div class="container">
        <h1>Currency Converter</h1>

        <!-- FORM -->
        <form action="">
            <!-- ===================== ENTER AMOUNT ===================== -->
            <div class="amount">
                <p>Enter Amount</p>
                <input type="text" value="1">
            </div>

            <!-- ===================== SELECT CURRENCY ===================== -->
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="">
                        <select name="from" id="">
                            <!-- <option value="USD">USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option> -->
                        </select>
                    </div>
                </div>

                <i class="fa-solid fa-arrow-right-arrow-left exchange-icon"></i>


                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                        <select name="to" id="">
                            <!-- <option value="USD">USD</option>
                            <option value="INR" selected>INR</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option> -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- ===================== GET EXCHANGE RATE ===================== -->
            <div class="msg">1 USD = 80 INR</div>
            <button>Get Exchange Rate</button>
        </form>
    </div>

    <!-- ===================== IMPORT JS FILES ===================== -->
    <script src="codes.js"></script>
    <script src="app.js"></script>

</body>

</html>
